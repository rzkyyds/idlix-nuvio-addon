<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IDLIX Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #video-container { width: 100%; max-width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; max-height: 100vh; object-fit: contain; }
    #info { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    #title { font-size: 16px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,.8); max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #quality { background: rgba(255,255,255,.15); padding: 4px 10px; border-radius: 6px; font-size: 13px; backdrop-filter: blur(8px); }
    #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.9); z-index: 100; }
    #error div { text-align: center; padding: 24px; }
    #error h2 { margin-bottom: 8px; }
    #error button { margin-top: 16px; padding: 10px 24px; background: #e50914; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; }
    .spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,.2); border-top-color: #e50914; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="info">
  <span id="title">Loading...</span>
  <span id="quality">HD</span>
</div>

<div id="loader"><div class="spinner"></div></div>

<div id="video-container">
  <video id="video" playsinline controls></video>
</div>

<div id="error">
  <div>
    <h2>Playback Failed</h2>
    <p id="error-msg"></p>
    <button onclick="retry()">Try Again</button>
  </div>
</div>

<script>
const video = document.getElementById('video');
const loader = document.getElementById('loader');
const errorDiv = document.getElementById('error');
const errorMsg = document.getElementById('error-msg');
const titleEl = document.getElementById('title');
const qualityEl = document.getElementById('quality');

const params = new URLSearchParams(window.location.search);
const streamJsonUrl = params.get('url');
const name = params.get('name') || params.get('title') || 'IDLIX Stream';

titleEl.textContent = name;

if (!streamJsonUrl) {
  showError('Missing stream URL (?url=...)');
} else {
  initPlayer();
}

async function initPlayer() {
  try {
    // Fetch the IDLIX stream config (master M3U8 as JSON)
    const resp = await fetch(streamJsonUrl, {
      headers: {
        'Accept': '*/*',
        'User-Agent': navigator.userAgent,
      }
    });
    
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    
    const text = await resp.text();
    
    // Check if it's a JSON wrapper or direct M3U8
    let m3u8Url = null;
    
    if (text.trim().startsWith('{')) {
      try {
        const cfg = JSON.parse(text);
        // IDLIX API returns: { success, data: { streamUrl, subtitles, ... } }
        const data = cfg.data || cfg;
        m3u8Url = data.streamUrl || data.url || data.file || data.playlist;
        
        // Set quality info
        if (data.maxHeight) qualityEl.textContent = `${data.maxHeight}p`;
        if (data.title) titleEl.textContent = data.title;
        
        // Add subtitles
        if (Array.isArray(data.subtitles)) {
          data.subtitles.forEach(sub => {
            const track = document.createElement('track');
            track.kind = 'subtitles';
            track.label = sub.label || sub.lang;
            track.srclang = sub.lang;
            track.src = sub.url;
            video.appendChild(track);
          });
        }
      } catch (_) {}
    }
    
    if (!m3u8Url) m3u8Url = streamJsonUrl; // It's already M3U8
    
    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        maxBufferLength: 30,
        backBufferLength: 90,
      });
      
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MEDIA_ATTACHED, () => {
        hls.loadSource(m3u8Url);
      });
      
      hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
        loader.style.display = 'none';
        const level = hls.levels[hls.currentLevel];
        if (level) qualityEl.textContent = `${level.height}p`;
        video.play().catch(() => {});
      });
      
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              console.error('HLS network error — retrying...');
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              console.error('HLS media error — recovering...');
              hls.recoverMediaError();
              break;
            default:
              hls.destroy();
              showError(`Playback error: ${data.details}`);
              break;
          }
        }
      });
      
      // Store for retry
      window._hls = hls;
      window._m3u8Url = m3u8Url;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Native HLS (Safari)
      video.src = m3u8Url;
      video.addEventListener('loadedmetadata', () => {
        loader.style.display = 'none';
        video.play().catch(() => {});
      });
    } else {
      showError('HLS not supported in this browser');
    }
    
  } catch (err) {
    showError(`Failed to load stream: ${err.message}`);
  }
}

function showError(msg) {
  loader.style.display = 'none';
  errorMsg.textContent = msg;
  errorDiv.style.display = 'flex';
}

function retry() {
  errorDiv.style.display = 'none';
  loader.style.display = 'flex';
  initPlayer();
}
</script>
</body>
</html>
